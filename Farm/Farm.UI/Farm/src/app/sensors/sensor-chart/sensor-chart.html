<div style="height: 400px; width: 100%;">
  <ngx-charts-line-chart
    [results]="chartData()"
    [xAxis]="true"
    [yAxis]="true"
    [legend]="true"
    [legendTitle]="'Sensors'"
    [showXAxisLabel]="true"
    [showYAxisLabel]="true"
    xAxisLabel="Time"
    yAxisLabel="Value"
    [scheme]="colorScheme()"
    (select)="onSelect($event)">
  </ngx-charts-line-chart>
</div>

@if(selectedSensorInfo()){
  <div class="sensor-info-panel">
    <h4>Sensor Details</h4>
    <p><strong>Name:</strong> {{ selectedSensorInfo()?.name }}</p>
    <p><strong>Serial Number:</strong> {{ selectedSensorInfo()?.serialNumber }}</p>
    <p><strong>Sensor ID:</strong> {{ selectedSensorInfo()?.sensorId }}</p>
  </div>
}
