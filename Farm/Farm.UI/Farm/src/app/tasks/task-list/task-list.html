<div class="task-container">
  <h2>📋 Actionable Tasks</h2>

  <div class="table-responsive">
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z8">
      <!-- Task Type Column -->
      <ng-container matColumnDef="taskType">
        <th mat-header-cell *matHeaderCellDef> Task Type </th>
        <td mat-cell *matCellDef="let task"> {{task.taskType}} </td>
      </ng-container>

      <!-- Farm Name -->
      <ng-container matColumnDef="farmName">
        <th mat-header-cell *matHeaderCellDef> Farm </th>
        <td mat-cell *matCellDef="let task"> {{task.farmName}} </td>
      </ng-container>

      <!-- Field Name -->
      <ng-container matColumnDef="fieldName">
        <th mat-header-cell *matHeaderCellDef> Field </th>
        <td mat-cell *matCellDef="let task"> {{task.fieldName}} </td>
      </ng-container>

      <!-- Crop Name -->
      <ng-container matColumnDef="cropName">
        <th mat-header-cell *matHeaderCellDef> Crop </th>
        <td mat-cell *matCellDef="let task"> {{task.cropName}} </td>
      </ng-container>

      <!-- Task Time -->
      <ng-container matColumnDef="taskTime">
        <th mat-header-cell *matHeaderCellDef> Task Time </th>
        <td mat-cell *matCellDef="let task"> {{task.taskTime | date:'medium'}} </td>
      </ng-container>

      <!-- Status (Completed / Pending) -->
      <ng-container matColumnDef="isCompleted">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let task">
          <mat-slide-toggle
            [checked]="task.isCompleted"
            (change)="toggleCompletion(task)">
            {{ task.isCompleted ? '✅ Completed' : '⏳ Pending' }}
          </mat-slide-toggle>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- عرض رسالة إذا كانت القائمة فارغة -->
  @if(dataSource().length === 0){
    <div class="empty-state">
      <p>No tasks available.</p>
    </div>
  }
</div>
